[project]
name = "memvine-sdk"
version = "0.1.0"
description = "Python client for the Memvine memory API: send conversations, recall memory, keep a live session's state."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memvine_sdk"]

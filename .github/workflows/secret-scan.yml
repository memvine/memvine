name: Secret scan
# Manual only (Actions tab → Run workflow): the account's GitHub Actions quota ran out, so pushes
# and pull requests do not trigger it. Run checks locally; see CONTRIBUTING.md.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI directly (the gitleaks-action needs a license key for organization repos).
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="--all"
